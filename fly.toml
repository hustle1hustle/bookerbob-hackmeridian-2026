app = "bookerbob-proof-of-stay"
primary_region = "mad"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  PROOF_OF_STAY_CONTRACT_ID = "CBZ7I3VOQEMK5LKDZLCUJ4VU6KQX5WT747XN4KLGM23EIUCISTDX5MTL"

[[mounts]]
  source = "pos_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
